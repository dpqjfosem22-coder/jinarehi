<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>공주월송 진아레히 | 분양상담</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#06172b;
  font-family:Arial,"Noto Sans KR",sans-serif;
  color:white;
}

.wrap{
  max-width:900px;
  margin:auto;
  background:#071a31;
  min-height:100vh;
}

/* 상단 */
.top{
  padding:16px;
  text-align:center;
  background:#061326;
  border-bottom:1px solid #b99245;
}

.top h1{
  margin:0;
  font-size:24px;
  color:#fff;
}

.top p{
  margin:7px 0 0;
  color:#d7b56d;
  font-size:15px;
}

/* 메인 이미지 */
.main-image{
  position:relative;
  width:100%;
}

.main-image img{
  display:block;
  width:100%;
  height:auto;
}

/* 이미지 위 클릭 영역 */
.hotspot{
  position:absolute;
  border:2px solid transparent;
  background:transparent;
  cursor:pointer;
}

.hotspot:active{
  background:rgba(255,200,70,.15);
}

/* 조건변경 */
.condition1{
  left:4%;
  top:45%;
  width:52%;
  height:9%;
}

.condition2{
  left:57%;
  top:45%;
  width:39%;
  height:9%;
}

/* 입지/단지 장점 */
.features{
  left:3%;
  top:54%;
  width:94%;
  height:14%;
}

/* 사전예약 혜택 */
.gift1{
  left:3%;
  top:69%;
  width:46%;
  height:18%;
}

/* 계약자 혜택 */
.gift2{
  left:51%;
  top:69%;
  width:46%;
  height:18%;
}

/* 전화번호 */
.phone-hotspot{
  left:4%;
  top:89%;
  width:92%;
  height:8%;
}

/* 하단 고정 버튼 */
.bottom-bar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  display:flex;
  z-index:50;
  max-width:900px;
  margin:auto;
  box-shadow:0 -4px 20px rgba(0,0,0,.35);
}

.bottom-bar a,
.bottom-bar button{
  flex:1;
  border:0;
  padding:17px 5px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.call{
  background:#b68b3d;
  color:#06172b;
  text-decoration:none;
  text-align:center;
}

.apply{
  background:#071a31;
  color:#fff;
}

/* 팝업 공통 */
.modal{
  display:none;
  position:fixed;
  z-index:100;
  left:0;
  top:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,.72);
  padding:18px;
  overflow:auto;
}

.modal-box{
  max-width:520px;
  margin:50px auto;
  background:white;
  color:#182132;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 15px 50px rgba(0,0,0,.45);
}

.modal-head{
  background:linear-gradient(135deg,#071a31,#12365b);
  color:white;
  padding:25px 22px;
  text-align:center;
}

.modal-head h2{
  margin:0;
  color:#e5c070;
  font-size:25px;
}

.modal-content{
  padding:22px;
}

.modal-content h3{
  color:#9a7028;
}

.close{
  width:100%;
  border:0;
  background:#eee;
  padding:15px;
  font-size:16px;
  cursor:pointer;
}

/* 상담 폼 */
.form-group{
  margin-bottom:14px;
}

.form-group label{
  display:block;
  margin-bottom:6px;
  font-weight:bold;
}

.form-group input,
.form-group select{
  width:100%;
  padding:14px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
}

.submit-btn{
  width:100%;
  border:0;
  border-radius:12px;
  padding:17px;
  background:#b68b3d;
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

.direct-call{
  display:block;
  margin-top:12px;
  padding:15px;
  background:#071a31;
  color:white;
  text-align:center;
  text-decoration:none;
  border-radius:12px;
  font-weight:bold;
}

.notice{
  font-size:12px;
  color:#777;
  margin-top:12px;
  line-height:1.5;
}

.gold{
  color:#a87722;
  font-weight:bold;
}

.space{
  height:75px;
}

</style>
</head>

<body>

<div class="wrap">

  <div class="top">
    <h1>공주월송 진아레히</h1>
    <p>선착순 동·호 지정 · 분양상담</p>
  </div>

  <div class="main-image">

    <!-- 메인 이미지 -->
    <img src="file_0000000032288209b30cf0d59c7fddda.png" alt="공주월송 진아레히">

    <!-- 1차 계약금 -->
    <button class="hotspot condition1"
      onclick="openInfo('condition')"
      aria-label="조건 변경 자세히 보기"></button>

    <!-- 정계약 5% -->
    <button class="hotspot condition2"
      onclick="openInfo('contract')"
      aria-label="정계약 조건 자세히 보기"></button>

    <!-- 단지 및 입지 -->
    <button class="hotspot features"
      onclick="openInfo('features')"
      aria-label="단지 장점 자세히 보기"></button>

    <!-- 예약 혜택 -->
    <button class="hotspot gift1"
      onclick="openInfo('reservation')"
      aria-label="사전예약 혜택 보기"></button>

    <!-- 계약 혜택 -->
    <button class="hotspot gift2"
      onclick="openInfo('gift')"
      aria-label="계약자 혜택 보기"></button>

    <!-- 전화번호 -->
    <a class="hotspot phone-hotspot"
       href="tel:15557258"
       aria-label="전화 상담"></a>

  </div>

  <div class="space"></div>

</div>


<!-- 하단 고정버튼 -->
<div class="bottom-bar">
  <a href="tel:15557258" class="call">
    ☎ 전화상담
  </a>

  <button class="apply" onclick="openConsult()">
    상담 신청
  </button>
</div>


<!-- 상세내용 팝업 -->
<div id="infoModal" class="modal">

  <div class="modal-box">

    <div class="modal-head">
      <h2 id="infoTitle">상세안내</h2>
    </div>

    <div class="modal-content" id="infoText"></div>

    <button class="close" onclick="closeInfo()">
      닫기
    </button>

  </div>

</div>


<!-- 상담신청 팝업 -->
<div id="consultModal" class="modal">

  <div class="modal-box">

    <div class="modal-head">
      <h2>공주월송 진아레히</h2>
      <p>방문예약 · 분양상담 신청</p>
    </div>

    <div class="modal-content">

      <div class="form-group">
        <label>성함</label>
        <input id="name" type="text" placeholder="성함을 입력해주세요">
      </div>

      <div class="form-group">
        <label>연락처</label>
        <input id="phone" type="tel" placeholder="010-0000-0000">
      </div>

      <div class="form-group">
        <label>관심 내용</label>

        <select id="interest">
          <option>방문예약</option>
          <option>분양가격 상담</option>
          <option>동·호수 상담</option>
          <option>계약조건 상담</option>
          <option>기타문의</option>
        </select>
      </div>

      <button class="submit-btn" onclick="requestConsult()">
        상담 신청하기
      </button>

      <a class="direct-call" href="tel:15557258">
        ☎ 바로 전화하기 1555-7258
      </a>

      <p class="notice">
        상담 신청을 누르면 담당자에게 전달할 내용을 확인할 수 있습니다.
        개인정보는 상담 목적 외 사용하지 않습니다.
      </p>

    </div>

    <button class="close" onclick="closeConsult()">
      나중에 보기
    </button>

  </div>

</div>


<script>

const contents = {

condition:{
title:"조건 변경 안내",
html:`
<h3>새롭게 변경된 계약 조건</h3>

<p>
<span class="gold">1차 계약금 500만원</span>
</p>

<p>
부담을 낮춘 새로운 계약조건으로
공주월송 진아레히를 만나보세요.
</p>

<p>
정확한 적용조건 및 세부사항은
분양상담을 통해 확인해 주세요.
</p>

<a class="direct-call" href="tel:15557258">
☎ 자세히 상담받기
</a>
`
},

contract:{
title:"정계약 조건",
html:`
<h3>정계약 5%</h3>

<p>
현재 <span class="gold">정계약 5%</span>
조건으로 상담이 가능합니다.
</p>

<p>
동·호수별 조건은 달라질 수 있으므로
상담을 통해 확인해주세요.
</p>

<a class="direct-call" href="tel:15557258">
☎ 계약조건 문의
</a>
`
},

features:{
title:"공주월송 진아레히 특별한 이유",
html:`
<h3>생활을 생각한 프리미엄 단지</h3>

<p>✓ 총 811세대 신축 아파트</p>

<p>✓ 단지 내 국공립 어린이집</p>

<p>✓ 입주민 전용 통학버스 운영</p>

<p>✓ 초등학교 5분 거리</p>

<p>✓ 공주·세종 BRT 연결</p>

<p>✓ 세종 이마트 차량 약 10분</p>

<p>✓ 단지 내 특화 조경</p>

<p>✓ 광폭주차장 약 1.57대 : 1</p>

<p>✓ 세종·서울 고속도로 연결 예정</p>

<a class="direct-call" href="tel:15557258">
☎ 상담받기
</a>
`
},

reservation:{
title:"사전예약 특별 혜택",
html:`
<h3>이정안 팀장 찾을 시 또는 사전예약 시</h3>

<p>
🎁 <span class="gold">신세계상품권 1만원</span>
</p>

<p>
＋
</p>

<p>
🎁 <span class="gold">냄비세트</span>
</p>

<p>
방문 전 반드시 사전예약 후
혜택 적용 여부를 확인해주세요.
</p>

<button class="submit-btn" onclick="closeInfo();openConsult();">
방문예약 신청하기
</button>
`
},

gift:{
title:"계약 고객 특별 혜택",
html:`
<h3>계약자 전원 특별 혜택</h3>

<p>
🎁 <span class="gold">그릇세트</span>
</p>

<p>
＋
</p>

<p>
✈️ <span class="gold">
제주도 항공권 및 숙박권
</span>
</p>

<p>
세부 제공조건과 이용조건은
계약 전 담당자에게 확인해주세요.
</p>

<a class="direct-call" href="tel:15557258">
☎ 혜택 자세히 문의하기
</a>
`
}

};


function openInfo(type){

document.getElementById("infoTitle").innerHTML =
contents[type].title;

document.getElementById("infoText").innerHTML =
contents[type].html;

document.getElementById("infoModal").style.display =
"block";

}


function closeInfo(){

document.getElementById("infoModal").style.display =
"none";

}


function openConsult(){

document.getElementById("consultModal").style.display =
"block";

}


function closeConsult(){

document.getElementById("consultModal").style.display =
"none";

}


function requestConsult(){

const name =
document.getElementById("name").value.trim();

const phone =
document.getElementById("phone").value.trim();

const interest =
document.getElementById("interest").value;


if(name === "" || phone === ""){

alert("성함과 연락처를 입력해주세요.");

return;

}


alert(
name +
" 고객님, 상담 신청 내용을 확인했습니다.\n\n" +
"관심내용 : " + interest +
"\n연락처 : " + phone +
"\n\n빠른 상담은 아래 전화상담 버튼을 이용해주세요."
);

}


/* 홈페이지 처음 열릴 때 상담창 자동 표시 */
window.onload = function(){

setTimeout(function(){

openConsult();

},800);

}


/* 팝업 바깥 터치하면 닫기 */
window.onclick = function(event){

const info =
document.getElementById("infoModal");

const consult =
document.getElementById("consultModal");

if(event.target === info){

closeInfo();

}

if(event.target === consult){

closeConsult();

}

}

</script>

</body>
</html>
